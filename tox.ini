[tox]
minversion = 4.0
envlist = py{311,312,313,314,315},style,coverage,mypy

[testenv]
usedevelop = True
passenv =
  https_proxy
  http_proxy
  no_proxy
  PYTEST_ADDOPTS
description =
  py{311,312,313,314,315}: Run unit tests against {envname}.
extras =
  test
commands=
  pytest --durations 25 {posargs}

[testenv:style]
description =
  Run style checks.
deps =
  flake8
commands =
  flake8 rst2txt tests

[testenv:coverage]
description =
  Run code coverage checks.
setenv =
  PYTEST_ADDOPTS = --cov rst2txt --cov-config {toxinidir}/pyproject.toml
commands =
  {[testenv]commands}
  coverage report

[testenv:mypy]
description =
  Run type checks.
deps =
  mypy
commands=
  mypy rst2txt
